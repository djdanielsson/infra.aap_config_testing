---
controller_credential_types:
  - name: aap-config-e2e-rest
    description: Custom REST API credential type for E2E
    kind: cloud
    inputs:
      fields:
        - id: rest_username
          type: string
          label: REST Username
        - id: rest_password
          type: string
          label: REST Password
          secret: true
      required:
        - rest_username
        - rest_password
    injectors:
      env:
        AAP_E2E_REST_USERNAME: !unsafe "{{ rest_username }}"
        AAP_E2E_REST_PASSWORD: !unsafe "{{ rest_password }}"
      extra_vars:
        aap_e2e_rest_username: !unsafe "{{ rest_username }}"
    state: "{{ e2e_state | default('present') }}"
