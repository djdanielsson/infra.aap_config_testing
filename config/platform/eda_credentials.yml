---
eda_credentials:
  - name: aap-config-e2e-scm
    description: Dummy SCM cred for E2E
    credential_type: Source Control
    organization: aap-config-e2e
    inputs:
      username: e2e
      password: e2e-not-a-real-secret
    state: "{{ e2e_state | default('present') }}"
  - name: aap-config-e2e-eda-registry
    description: Registry cred for decision environments
    credential_type: Container Registry
    organization: aap-config-e2e
    inputs:
      host: quay.io
      username: e2e
      password: e2e-not-a-real-secret
      verify_ssl: false
    state: "{{ e2e_state | default('present') }}"
  - name: aap-config-e2e-basic-stream
    description: Basic Event Stream credential
    credential_type: Basic Event Stream
    organization: aap-config-e2e
    inputs:
      username: e2e-stream
      password: e2e-not-a-real-secret
    state: "{{ e2e_state | default('present') }}"
  - name: aap-config-e2e-eda-rest
    description: Custom EDA REST credential instance
    credential_type: aap-config-e2e-eda-rest
    organization: aap-config-e2e
    inputs:
      rest_username: e2e
      rest_password: e2e-not-a-real-secret
    state: "{{ e2e_state | default('present') }}"
