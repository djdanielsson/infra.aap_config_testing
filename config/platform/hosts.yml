---
controller_hosts:
  - name: aap-config-e2e-host
    inventory: aap-config-e2e-inventory
    description: Enabled local host
    enabled: true
    variables:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python | default('/usr/bin/python3') }}"
      e2e_host_role: primary
    state: "{{ e2e_state | default('present') }}"
  - name: aap-config-e2e-host-disabled
    inventory: aap-config-e2e-inventory
    description: Disabled host variant
    enabled: false
    variables:
      ansible_connection: local
      e2e_host_role: disabled
    state: "{{ e2e_state | default('present') }}"
  - name: aap-config-e2e-host-ops
    inventory: aap-config-e2e-inventory
    description: Host for nested group membership
    enabled: true
    variables:
      ansible_connection: local
      e2e_host_role: ops
    state: "{{ e2e_state | default('present') }}"
