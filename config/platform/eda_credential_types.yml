---
eda_credential_types:
  - name: aap-config-e2e-eda-rest
    description: Custom EDA credential type for platform E2E
    inputs:
      fields:
        - type: string
          id: rest_username
          label: REST Username
        - secret: true
          type: string
          id: rest_password
          label: REST Password
      required:
        - rest_username
        - rest_password
    injectors:
      env:
        EDA_E2E_REST_USERNAME: !unsafe "{{ rest_username }}"
        EDA_E2E_REST_PASSWORD: !unsafe "{{ rest_password }}"
    state: "{{ e2e_state | default('present') }}"
