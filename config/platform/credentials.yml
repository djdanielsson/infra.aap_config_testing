---
controller_credentials:
  - name: aap-config-e2e-machine
    description: Machine credential (password)
    credential_type: Machine
    organization: aap-config-e2e
    inputs:
      username: e2e
      password: e2e-not-a-real-secret
    state: "{{ e2e_state | default('present') }}"
  - name: aap-config-e2e-scm
    description: Source Control credential
    credential_type: Source Control
    organization: aap-config-e2e
    inputs:
      username: e2e-scm
      password: e2e-not-a-real-secret
    state: "{{ e2e_state | default('present') }}"
  - name: aap-config-e2e-vault
    description: Vault credential
    credential_type: Vault
    organization: aap-config-e2e
    inputs:
      vault_password: e2e-vault-not-real
    state: "{{ e2e_state | default('present') }}"
  - name: aap-config-e2e-registry
    description: Container Registry credential for EE/EDA pulls
    credential_type: Container Registry
    organization: aap-config-e2e
    inputs:
      host: quay.io
      username: e2e
      password: e2e-not-a-real-secret
      verify_ssl: false
    state: "{{ e2e_state | default('present') }}"
  - name: aap-config-e2e-galaxy
    description: Galaxy / Automation Hub token stub
    credential_type: Ansible Galaxy/Automation Hub API Token
    organization: aap-config-e2e
    inputs:
      url: https://galaxy.ansible.com/
      token: e2e-not-a-real-token
    state: "{{ e2e_state | default('present') }}"
  - name: aap-config-e2e-rest-cred
    description: Instance of custom REST credential type
    credential_type: aap-config-e2e-rest
    organization: aap-config-e2e
    inputs:
      rest_username: e2e
      rest_password: e2e-not-a-real-secret
    state: "{{ e2e_state | default('present') }}"
