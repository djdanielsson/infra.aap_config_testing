---
# Smoke E2E: Molecule owns the full lifecycle.
#
# Platform MUST be named localhost — Molecule create/destroy limit to the
# platform hostname. Playbooks that use hosts: localhost were silently empty
# when the platform was named "aap".
#
#   destroy  → reset Molecule state; tear down AAP/CRC only if vars say so
#   create   → CRC (if configured / not running) + AAP; write .cache/aap-env.yml
#   prepare  → assert platform env is ready
#   converge → apply config via infra.aap_configuration.dispatch
#   verify   → assert objects exist via gateway/controller APIs
#   cleanup  → remove test objects (state: absent)
#   destroy  → optional AAP/CRC teardown (AAP_E2E_DESTROY_*)
role_name_check: 0
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
platforms:
  - name: localhost
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.cache/collections
    ANSIBLE_CONFIG: ${MOLECULE_PROJECT_DIRECTORY}/ansible.cfg
    # Custom modules need the project venv (aap_configuration_e2e installed there).
    ANSIBLE_PYTHON_INTERPRETER: ${MOLECULE_PROJECT_DIRECTORY}/.venv/bin/python
    PATH: ${MOLECULE_PROJECT_DIRECTORY}/.venv/bin:${PATH}
    AAP_CONFIGURATION_E2E_PYTHON: ${MOLECULE_PROJECT_DIRECTORY}/.venv/bin/python
  config_options:
    defaults:
      gathering: explicit
      host_key_checking: false
      # Force venv Python for modules (do not use auto discovery).
      interpreter_python: ${MOLECULE_PROJECT_DIRECTORY}/.venv/bin/python
  playbooks:
    create: ../shared/create.yml
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    verify: ../shared/verify.yml
    cleanup: ../shared/cleanup.yml
    destroy: ../shared/destroy.yml
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: "{{ lookup('env', 'ANSIBLE_PYTHON_INTERPRETER') | default(lookup('env', 'MOLECULE_PROJECT_DIRECTORY') ~ '/.venv/bin/python', true) }}"
    group_vars:
      all:
        # create: provision platform unless AAP_E2E_SKIP_PROVISION=true
        aap_e2e_provision_crc: true
        aap_e2e_provision_aap: true
        # destroy: leave platform up unless AAP_E2E_DESTROY_AAP / _CRC
verifier:
  name: ansible
scenario:
  test_sequence:
    # Start with destroy so Molecule always re-runs create (idempotent; CRC/AAP
    # stay up unless AAP_E2E_DESTROY_* is set).
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
